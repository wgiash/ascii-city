<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A playable ASCII city</title>
<style>
  
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
       overscroll-behavior:none;touch-action:none}
  canvas{display:block;width:100vw;height:100vh;cursor:grab;touch-action:none}
  #hud{position:fixed;left:18px;top:14px;color:#8f9ab0;font:12px/1.5 "Menlo","Osaka-Mono",monospace;
       pointer-events:none;text-shadow:0 0 8px rgba(120,180,255,.4)}
  #hud b{font-size:15px;letter-spacing:3px;color:#ffd870}
  #hint{position:fixed;left:18px;bottom:14px;color:#4a5468;font:11px/1.6 "Menlo",monospace;
        pointer-events:none;transition:opacity 2s}
  #pop{position:fixed;left:18px;top:14px;color:#8fe8b8;font:12px/1.5 "Menlo",monospace;
       letter-spacing:1px;pointer-events:none;text-shadow:0 0 8px rgba(90,230,160,.4)}
  #toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);color:#bfe8d0;
       font:13px/1.4 "Menlo",monospace;letter-spacing:1px;pointer-events:none;
       text-shadow:0 0 10px rgba(120,230,170,.5);opacity:0;transition:opacity .5s}
</style>
</head>
<body>
<canvas id="cv"></canvas>
  <div class="unit"><button class="gk pill" data-k="shift">⇧</button><div class="lbl">Boost</div></div>
 </div>
 <div class="cl right">
  <div class="unit"><button class="gk circ" data-k="f">F</button><div class="lbl">Laser</div></div>
  <div class="unit">
   <div class="arrows">
    <button class="gk circ sm" data-k="arrowleft">←</button>
    <button class="gk circ sm" data-k="arrowright">→</button>
   </div>
   <div class="lbl">Aim</div>
  </div>
 </div>
</div>
 <div class="ab"><b class="k" data-k="arrowleft">←</b><b class="k" data-k="arrowright">→</b></div>
 <div class="spk"></div>
 <div class="mini">
  <span class="mcell"><span class="mlab">BOOST</span><b class="k" data-k="shift">⇧</b></span>
  <span class="mcell"><span class="mlab">LASER</span><b class="k" data-k="f">F</b></span>
 </div>
</div>
  <div class="krow"><b data-k="a">[A]</b><b data-k="s">[S]</b><b data-k="d">[D]</b></div>
 </div>
 <div class="pad">
  <div class="krow"><b data-k="arrowleft">[&lt;]</b><b data-k="arrowright">[&gt;]</b></div>
  <div class="krow"><b data-k="f">[F]</b><span class="klabel">LASER</span></div>
 </div>
</div>
<script>
'use strict';
const RMOTION=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FLASH_MS=RMOTION?1e9:420;                   // photosensitivity: no >3Hz flashing
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const gcv=document.createElement('canvas'),gctx=gcv.getContext('2d');  // quarter-res bloom layer
let GLOWQ=[];                                            // cells that bloom this frame (x,r,co)
// the bloom's per-frame canvas blur is brutal on mobile Safari — enough to
// take the whole page down. Touch devices run matte.
const BLOOM_OK=!matchMedia('(pointer: coarse)').matches;

/* ---------- rng / hash ---------- */
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry(7161);
function h32(x){x|=0;x=Math.imul(x^x>>>16,0x45d9f3b);x=Math.imul(x^x>>>16,0x45d9f3b);
  return((x^x>>>16)>>>0)/4294967296}
const hash2=(a,b)=>h32(a*374761393+b*668265263+974711);
const hash3=(a,b,c)=>h32(a*374761393+b*668265263+c*2246822519+974711);
function vn(x,y){                      // smooth value noise, for the clouds
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}

/* ---------- palette: flat kinds x 4 fog levels ---------- */
/* 0 FACE 1 ROOF 2 EDGE 3 DIM 4 WHITE 5 WHITE2 6 BEACON 7 CAR, then hue pairs (bright,dim) */
const KRGB=[
 [7,9,20],[18,24,48],[150,170,230],[90,110,175],
 [240,246,255],[255,255,252],[255,60,50],[255,225,150],
 [70,165,255],[38,90,160],   // neon blue — the city's one light color
 [255,240,190],[150,138,100], // horizon cream
 [255,225,120],[150,128,66],  // sun-line gold
 [255,120,200],[150,60,110],  // hot pink
 [80,255,95],[40,150,55],    // gamma green
 [235,242,255],[140,150,175], // cool white
 [255,190,90],[150,110,50],   // warm amber
 [255,120,60],[150,70,35],   // orange
 [10,30,88],[4,15,52],       // deep water
 [55,130,65],[22,54,28],     // park green
 [110,120,150],[64,72,95],    // sidewalk blue-gray
 [7,9,16],[12,15,26],         // wall glyph body tones (slabs, mullions)
 [18,22,36],[25,30,48],
 [20,26,44],[44,54,86],       // cloud body, moonlit cloud edge (faint)
 [185,105,255],[95,55,160]];   // neon violet — the nose laser
const FOGM=[0.86,0.56,0.36,0.2];      // mix weight toward the dusk haze (bright kinds)
const HAZE=[40,50,110];
const FPAL=KRGB.map(c=>{
  const lum=(c[0]+c[1]+c[2])/3;       // darks fade to BLACK, keeping contrast deep
  return FOGM.map((g,fi)=>{
    if(lum<70){const k=[0.88,0.62,0.4,0.24][fi];
      return`rgb(${c[0]*k|0},${c[1]*k|0},${c[2]*k|0})`}
    if(fi===0)return`rgb(${c[0]*0.9|0},${c[1]*0.9|0},${c[2]*0.9|0})`   // near: darken, never wash
    return`rgb(${c[0]*g+HAZE[0]*(1-g)|0},${c[1]*g+HAZE[1]*(1-g)|0},${c[2]*g+HAZE[2]*(1-g)|0})`})});
const WPICK=[1,1,2,1,0,5,1,2,4,1,3,2,0,6,5,7]; // warm sprawl, mako-green accents
/* facade background shades: 4 body tones x 2 sides x 3 skylight bands x 4 fog,
   plus 4 roof shades at the end — solid fills painted behind the glyphs */
const GLOW=[90,110,190];
/* 8 body hues: green-tinted industrial darks */
const BODYT=[[2,3,6],[4,5,10],[7,9,16],[9,8,14],[5,7,13],[10,11,18],[15,17,28],[3,3,7]];
const FBGC=[];
{const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
 const FK=[0.86,0.64,0.44,0.3];
 for(let t=0;t<8;t++)for(let s=0;s<2;s++)for(let b=0;b<3;b++)for(let f=0;f<4;f++){
   let c=mixc(BODYT[t],GLOW,b===0?0.09:b===1?0.035:0.01);
   const m=(s?0.75:1)*FK[f];
   FBGC.push(`rgb(${c[0]*m|0},${c[1]*m|0},${c[2]*m|0})`)}
 for(let f=0;f<4;f++){const m=FK[f];                     // 192..195: roofs
   FBGC.push(`rgb(${10*m|0},${12*m|0},${24*m|0})`)}
 for(let f=0;f<4;f++){const m=FK[f];                     // 196..199: tree foliage
   FBGC.push(`rgb(${14*m|0},${34*m|0},${18*m|0})`)}
 for(let f=0;f<4;f++){const m=FK[f];                     // 200..203: river water (recessed, dark)
   FBGC.push(`rgb(${5*m|0},${14*m|0},${48*m|0})`)}
 for(let f=0;f<4;f++){const m=FK[f];                     // 204..207: bridge deck
   FBGC.push(`rgb(${17*m|0},${20*m|0},${34*m|0})`)}
 for(let f=0;f<4;f++){const m=FK[f];                     // 208..211: asphalt
   FBGC.push(`rgb(${13*m|0},${15*m|0},${26*m|0})`)}
 for(let f=0;f<4;f++){const m=FK[f];                     // 212..215: lots & courtyards
   FBGC.push(`rgb(${8*m|0},${9*m|0},${18*m|0})`)}
 for(let f=0;f<4;f++){const m=FK[f];                     // 216..219: park lawn
   FBGC.push(`rgb(${9*m|0},${24*m|0},${12*m|0})`)}
 for(let f=0;f<4;f++){const m=FK[f];                     // 220..223: promenade paving
   FBGC.push(`rgb(${18*m|0},${21*m|0},${36*m|0})`)}}
const FBGB=Array.from({length:FBGC.length},()=>[]);
const hueKind=bid=>8+2*WPICK[(hash2(bid,77)*16)|0];
/* the city sits back a step; the ship, monsters and fire stay at full voltage */
const dimC=c=>{const m=c.match(/\d+/g).map(Number);
  const mx=Math.max(m[0],m[1],m[2]),mn=Math.min(m[0],m[1],m[2]);
  if(mx>140&&mx-mn>50)                                  // neon only: bright AND saturated
    return`rgb(${m[0]},${m[1]},${m[2]})`;   // undimmed: the lights burn full
  return`rgb(${m[0]},${m[1]},${m[2]})`};
const FPALD=FPAL.map(r=>r.map(dimC));
for(let i=0;i<FBGC.length;i++)FBGC[i]=dimC(FBGC[i]);
/* buildings go ink-black: bodies recede, the lights float */
const inkC=c=>{const m=c.match(/\d+/g);
  return`rgb(${m[0]*0.45|0},${m[1]*0.45|0},${m[2]*0.45|0})`};
for(let i=0;i<196;i++)FBGC[i]=inkC(FBGC[i]);            // facade + roof backdrops
for(const P of [FPAL,FPALD])
  for(let k=30;k<=33;k++)for(let f=0;f<4;f++)P[k][f]=inkC(P[k][f]);  // wall glyph tones
/* every light in the CITY burns the same neon blue; the ship, monsters,
   lasers and fire draw from FPAL and keep their own colors */
for(let k=10;k<=23;k+=2){FPALD[k]=FPALD[8].slice();FPALD[k+1]=FPALD[9].slice()}
/* the ship outshines everything around it */
const glowUp=c=>{const m=c.match(/\d+/g).map(Number);
  const av=(m[0]+m[1]+m[2])/3;                            // saturate, then brighten
  const f2=v=>Math.max(0,Math.min(255,(av+(v-av)*1.45)*1.35))|0;
  return`rgb(${f2(m[0])},${f2(m[1])},${f2(m[2])})`};
for(const k of [22,23])for(let f=0;f<4;f++)FPAL[k][f]=glowUp(FPAL[k][f]);

/* ---------- city: roads (1 street/one-way, 2 avenue, 3 highway), river, parks ---------- */
const G=120, HGT=new Uint8Array(G*G), BID=new Int32Array(G*G), TER=new Uint8Array(G*G),
      RI=new Uint8Array(G),RJ=new Uint8Array(G),RIO=new Uint8Array(G),RJO=new Uint8Array(G),
      RIW=new Uint8Array(G),RJW=new Uint8Array(G);
const TREES=[],BRI=new Uint8Array(G),BRJ=new Uint8Array(G),PIER=new Uint8Array(G*G),
      TRAP=new Uint8Array(G*G),
      BRIDGES=[],FURN=[],PEDS=[];
let POPBASE=0;
(function gen(){
  function lay(T,O,Wd){let p=14;                          // streets & avenues only
    while(p<G-7){const rr=rnd();const t=rr<0.42?2:1;
      for(let k=0;k<t;k++){T[p+k]=t;O[p+k]=k;Wd[p+k]=t}
      p+=t+3+(rnd()*6|0)}}
  lay(RI,RIO,RIW);lay(RJ,RJO,RJW);
  function belt(T,O,Wd,p){for(let k=0;k<3;k++){T[p+k]=3;O[p+k]=k;Wd[p+k]=3}}
  belt(RI,RIO,RIW,9);belt(RJ,RJO,RJW,G-13);               // elevated beltway at the edges
  for(let j=0;j<G;j++){                                   // winding river
    const c=G*0.42+Math.sin(j*0.09)*9+j*0.12;
    for(let i=0;i<G;i++)if(Math.abs(i-c)<2.6)TER[j*G+i]=1}
  for(let j=1;j<G-1;j++)for(let i=1;i<G-1;i++){           // riverside promenades
    if(TER[j*G+i]||RI[i]||RJ[j])continue;
    if(TER[j*G+i-1]===1||TER[j*G+i+1]===1||TER[(j-1)*G+i]===1||TER[(j+1)*G+i]===1)
      TER[j*G+i]=3}
  for(let i=0;i<G;i++){   // only roads perpendicular to the river may bridge it
    if(RI[i])BRI[i]=RI[i]===3?1:0;          // north-south roads run parallel: never
    if(RJ[i])BRJ[i]=RJ[i]===3?1:(hash2(i-RJO[i],211)<0.3?1:0)}
  function scanBridges(T,B,O,W2,ax){                      // spans where a bridge crosses water
    for(let i=0;i<G;i++){
      if(!T[i]||T[i]===3||O[i]!==0||!B[i])continue;
      const c=i+W2[i]/2;let run=null;
      for(let k=0;k<G;k++){
        const w=ax===0?TER[k*G+i]===1:TER[i*G+k]===1;
        if(w){if(!run)run={s:k};run.e=k}
        else if(run){if(run.e>=run.s)BRIDGES.push({ax,c,s:run.s-0.2,e:run.e+1.2,w:W2[i]});run=null}}
    }}
  scanBridges(RI,BRI,RIO,RIW,0);scanBridges(RJ,BRJ,RJO,RJW,1);
  for(let j=2;j<G-2;j++)for(let i=2;i<G-2;i++){           // street furniture, on the sidewalks
    const t=Math.max(RI[i],RJ[j]);if(!t||t>2||TER[j*G+i])continue;
    const ax=RI[i]>=RJ[j];
    if(ax?RIO[i]:RJO[j])continue;                          // one strip per road, not per lane
    const base=ax?i-RIO[i]:j-RJO[j], wd=ax?RIW[i]:RJW[j];
    const h7=hash2(i*3,j*7);
    const edge=base+(hash2(i*7,j*3)<0.5?0.13:wd-0.13);     // a sidewalk side
    const along=(ax?j:i)+0.15+hash2(j,i)*0.7;
    const X=ax?edge:along, Z=ax?along:edge;
    if(h7<0.3)FURN.push({x:X,z:Z,k:0});                    // lamppost
    if(h7>0.9)FURN.push({x:X,z:Z,k:1,hu:8+2*WPICK[(hash2(i*5,j*9)*16)|0]}); // sign
    else if(h7>0.84)FURN.push({x:X,z:Z,k:2});              // garbage can
    else if(h7>0.78)FURN.push({x:X,z:Z,k:3});              // bench
  }
  for(let j=2;j<G-2;j++)for(let i=2;i<G-2;i++){           // stoplights: paired poles per crossing
    if(!RI[i]||!RJ[j]||RI[i]>2||RJ[j]>2||RIO[i]||RJO[j]||TER[j*G+i])continue;
    const wi=RIW[i],wj=RJW[j];
    FURN.push({x:i+0.1,z:j+0.1,k:4,ii:i,jj:j});
    FURN.push({x:i+wi-0.1,z:j+wj-0.1,k:4,ii:i,jj:j});
  }
  for(let j=2;j<G-2;j++)for(let i=2;i<G-2;i++){           // shop signs jutting over the sidewalk
    const t=Math.max(RI[i],RJ[j]);if(!t||t>2||TER[j*G+i])continue;
    const cand=[];
    if(BID[j*G+i-1]>0)cand.push([i+0.08,j+0.3+hash2(i,j*3)*0.4]);
    if(BID[j*G+i+1]>0)cand.push([i+0.92,j+0.3+hash2(i*5,j)*0.4]);
    if(BID[(j-1)*G+i]>0)cand.push([i+0.3+hash2(i*7,j)*0.4,j+0.08]);
    if(BID[(j+1)*G+i]>0)cand.push([i+0.3+hash2(i,j*9)*0.4,j+0.92]);
    for(const[sx,sz]of cand)if(hash2((sx*31)|0,(sz*37)|0)<0.42)
      FURN.push({x:sx,z:sz,k:5,hu:8+2*WPICK[(hash2((sx*23)|0,(sz*29)|0)*16)|0],
                 hgt:0.5+hash2((sx*41)|0,(sz*43)|0)*0.45,ln:2+(hash2((sx*3)|0,(sz*7)|0)*3|0)});
  }
  for(let j=1;j<G-1;j++)for(let i=1;i<G-1;i++){           // piers off the promenades
    if(TER[j*G+i]!==1)continue;
    if(TER[j*G+i-1]===3&&rnd()<0.12)PIER[j*G+i]=1;
    else if(TER[j*G+i+1]===3&&rnd()<0.12)PIER[j*G+i]=2;
    else if(TER[(j-1)*G+i]===3&&rnd()<0.12)PIER[j*G+i]=3;
    else if(TER[(j+1)*G+i]===3&&rnd()<0.12)PIER[j*G+i]=4}
  for(let k=0;k<6;k++){                                   // parks
    const pi=6+(rnd()*(G-26)|0),pj=6+(rnd()*(G-26)|0),pw=5+(rnd()*9|0),ph=5+(rnd()*9|0);
    for(let j=pj;j<pj+ph;j++)for(let i=pi;i<pi+pw;i++)
      if(!TER[j*G+i]&&!RI[i]&&!RJ[j])TER[j*G+i]=2}
  for(let j=0;j<G;j++)for(let i=0;i<G;i++)                // park trees (sprites)
    if(TER[j*G+i]===2&&rnd()<0.5)
      TREES.push({x:i+0.2+rnd()*0.6,z:j+0.2+rnd()*0.6,h:0.45+rnd()*0.45});
  const dt=[[G*0.5,G*0.5],[G*0.3,G*0.62],[G*0.72,G*0.34]];
  const baseH=(i,j)=>{let m=0;for(const[cx,cy]of dt){
    const d=((i-cx)**2+(j-cy)**2)/(G*G*0.012);m=Math.max(m,Math.exp(-d))}
    return 8+52*m};
  let nb=1;
  for(let j=0;j<G;j++)for(let i=0;i<G;i++){
    if(RI[i]||RJ[j]||TER[j*G+i]||BID[j*G+i])continue;
    if(rnd()<0.06){BID[j*G+i]=-1;continue}
    const w=1+(rnd()<0.5?0:rnd()<0.6?1:2), d=1+(rnd()<0.5?0:rnd()<0.6?1:2);
    const ok=[];
    for(let dj=0;dj<d;dj++)for(let di=0;di<w;di++){
      const ii=i+di,jj=j+dj;
      if(ii>=G||jj>=G||RI[ii]||RJ[jj]||TER[jj*G+ii]||BID[jj*G+ii])continue;
      ok.push(jj*G+ii)}
    if(!ok.length)continue;
    let h=baseH(i,j)*(0.6+rnd()*0.9);
    if(rnd()<0.15)h=4+rnd()*5;                            // few small ones
    else if(rnd()<0.14)h=14+rnd()*16;                     // scattered mid-rises
    if(rnd()<0.04)h=42+rnd()*18;
    h=Math.max(3,Math.min(60,h))|0;
    const id=nb++;
    for(const c of ok){BID[c]=id;HGT[c]=h}
    if(ok.length>=6&&h>=18)                               // stepped setbacks on big towers
      for(const c of ok)if(hash2(c,5)<0.45)HGT[c]=Math.max(6,(h*0.55)|0);
    if(ok.length>=4&&h>=8&&rnd()<0.75)                    // tower-on-tower tiers
      HGT[ok[(rnd()*ok.length)|0]]=Math.min(60,h+(h>=20?4+(rnd()*4|0):3+(rnd()*3|0)));
  }
  for(let j=47;j<75;j++)for(let i=59;i<87;i++){           // the Mako reactor megastructure
    const d=Math.hypot(i+0.5-72.5,j+0.5-60.5), c=j*G+i;
    if(d>13)continue;
    TER[c]=0;PIER[c]=0;
    const a=Math.atan2(j+0.5-60.5,i+0.5-72.5);
    const gate=Math.abs(Math.sin(2*a))<0.2;               // cardinal access corridors
    if(d<3){HGT[c]=78;BID[c]=-3}                          // core tower
    else if(d<5){HGT[c]=38;BID[c]=-3}                     // high ring
    else if(d<6.5){HGT[c]=0;BID[c]=-1}                    // inner plaza
    else if(d<8.5){if(gate){HGT[c]=0;BID[c]=-1}
      else{HGT[c]=22;BID[c]=-4}}                          // massive engine blocks
    else if(d<10.5){if(gate){HGT[c]=0;BID[c]=-1}
      else if(Math.abs(Math.sin(4*a))>0.8){HGT[c]=30;BID[c]=-3}  // pylons
      else{HGT[c]=16;BID[c]=-3}}
    else{if(!gate&&hash2(i,j)<0.35){HGT[c]=8+((hash2(i*3,j*7)*8)|0);BID[c]=-3}
      else{HGT[c]=0;BID[c]=-1}}                           // industrial apron
  }
  for(let k=0;k<4;k++){                                   // beacon smokestacks
    const a=Math.PI/4+k*Math.PI/2;
    const si=(72.5+Math.cos(a)*11.5)|0, sj=(60.5+Math.sin(a)*11.5)|0;
    HGT[sj*G+si]=52;BID[sj*G+si]=-3}
  for(let j=1;j<G-1;j++)for(let i=1;i<G-1;i++){           // riverside benches, facing the water
    if(TER[j*G+i]!==3||hash2(i*9,j*11)>=0.35)continue;
    let ox=0.5,oz=0.5;
    if(TER[j*G+i+1]===1)ox=0.72;else if(TER[j*G+i-1]===1)ox=0.28;
    if(TER[(j+1)*G+i]===1)oz=0.72;else if(TER[(j-1)*G+i]===1)oz=0.28;
    FURN.push({x:i+ox,z:j+oz,k:3});}
  for(let j=1;j<G-1;j++)for(let i=1;i<G-1;i++){           // street, courtyard & riverside trees
    const c=j*G+i;

  if(hash2(idx,23)<0.18&&Math.hypot(ux-0.72,uz-0.28)<0.06){put(x,r,'+',2,fog);return} // mast
  const gx=(fx*3)|0,gz=(fz*3)|0;
  if(hash2(idx,27)<0.03&&ux>0.55&&uz>0.55){                       // roof garden corner
    put(x,r,hash3(gx,gz,9)<0.35?'%':'.',hash3(gx,gz,11)<0.5?26:27,fog);return}
  if(hash2(gx*7+1,gz*5+3)<0.07){put(x,r,'#',3,fog);return}        // AC / vents
  const dd=hash3(gx,gz,1);
  if(fog>=1){put(x,r,dd<0.08?'.':' ',1,fog);return}
  put(x,r,dd<0.22?'.':dd<0.32?',':' ',1,fog);
}
function groundTex(x,r,fx,fz,fog){
  fx-=G*Math.floor(fx/G);fz-=G*Math.floor(fz/G);          // wrapped world
  const ix=fx|0,iz=fz|0;
  const ter=TER[iz*G+ix], ri=RI[ix], rj=RJ[iz], t=Math.max(ri,rj);
  const bridged=(ri&&BRI[ix])||(rj&&BRJ[iz]);
  if(ter===1&&!bridged){                                          // open water
    const pr=PIER[iz*G+ix];
    if(pr){const ux4=fx-ix,uz4=fz-iz;                             // piers off the banks
      const on=pr<=2?(Math.abs(uz4-0.5)<0.16&&(pr===1?ux4<0.85:ux4>0.15))
                    :(Math.abs(ux4-0.5)<0.16&&(pr===3?uz4<0.85:uz4>0.15));
      if(on){const pk=hash2((fx*6)|0,(fz*6)|0);
        put(x,r,pk<0.1?'o':pk<0.6?'=':':',pk<0.1?7:29,fog);return}}
    const wv=hash3((fx*3)|0,(fz*3)|0,TB&7);
    if(wv<0.28){put(x,r,'~',wv<0.09?24:25,fog);return}
    const rc=(fx*6)|0;
    if(hash2(rc,7)<0.12&&hash3(rc,(fz*2)|0,1)<0.55){
      const hs=hash2(rc,3);
      put(x,r,':',hs<0.5?9:25,fog);return}               // cool reflections only
    put(x,r,wv<0.5?'.':' ',25,fog);return}
  if(t){                                                          // roads & bridges
    const ax=ri>=rj;
    const u=ax?(fx-(ix-RIO[ix])):(fz-(iz-RJO[iz]));
    const wd=ax?RIW[ix]:RJW[iz], lg=ax?fz:fx;
    if(ter===1&&(u<0.12||u>wd-0.12)){put(x,r,'=',2,fog);return}   // bridge railing
    if(ri&&rj&&ter!==1){                                          // intersection
      const fu=fx-ix, fv=fz-iz;
      if((fu<0.26||fu>0.74)&&((fz*8)|0)%2===0){put(x,r,'=',2,fog);return}    // zebra crossing
      if((fv<0.26||fv>0.74)&&((fx*8)|0)%2===0){put(x,r,'=',2,fog);return}}
    /* faint lamp shimmer on the wet asphalt: dots, not discs */
    const ll=Math.round(lg/2)*2, lu=u<wd/2?0.14:wd-0.14;
    const dl=Math.hypot(lg-ll,u-lu);
    if(dl<0.22&&t<3){const pv=hash2((fx*9)|0,(fz*9)|0);
      if(pv<0.6-dl*2.2){put(x,r,pv<0.18?':':'.',9,fog);return}}
    if(t<3&&ter!==1&&(u<0.25||u>wd-0.25)){                        // sidewalk + furniture
      if(Math.abs(u-0.25)<0.05||Math.abs(u-(wd-0.25))<0.05){
        put(x,r,'=',2,fog);return}                                // bright curb line
      const fu=hash2((lg*2)|0,(ax?ix:iz)*3);
      if(fu<0.02){put(x,r,'i',6,fog);return}                      // hydrant
      if(fu<0.045){put(x,r,'#',19,fog);return}                    // postal box
      if(fu<0.08){put(x,r,'o',9+2*((fu*997|0)%8),fog);return}     // vending glow
      if(fu>0.08&&fu<0.10){const stm=((NOW/350+lg*3)|0)%3;        // steam grate, breathing
        put(x,r,stm===0?'~':stm===1?':':'.',stm===0?35:3,fog);return}
      if(Math.abs(lg-Math.round(lg))<0.03){put(x,r,'-',29,fog);return} // expansion joints
      const sg=hash2((fx*13)|0,(fz*13)|0);
      put(x,r,sg<0.55?':':'.',sg<0.15?28:29,fog);return}
    if(t===2&&Math.abs(u-wd/2)<0.05){put(x,r,':',9,fog);return}   // avenue center line
    if(t===3){                                                    // highway
      if(Math.abs(u-wd/2)<0.07){put(x,r,'=',1,fog);return}        // median
      if((u>0.15&&u<0.24)||(u>wd-0.24&&u<wd-0.15)){put(x,r,':',3,fog);return}}
    const lanes=t===1?[0.5]:t===2?[wd*0.27,wd*0.73]:[wd*0.3,wd*0.7];
    for(const lc of lanes){
      if(Math.abs(u-lc)<0.04&&(lg*1.6)%1<0.22){
        put(x,r,'.',3,fog);return}                                // small white dashes
      if(Math.abs(u-lc)<0.12&&hash2((fx*6)|0,(fz*6)|0)<0.18){
        put(x,r,':',0,fog);return}}                               // tire sheen along the lanes
    if(t<3&&(Math.abs(u-0.3)<0.03||Math.abs(u-(wd-0.3))<0.03)&&((lg*2)|0)%4===0){
      put(x,r,'=',1,fog);return}                                  // storm drains at the gutter
    if(hash2((fx*2)|0,(fz*2)|0)<0.015){put(x,r,'o',1,fog);return} // manhole
    const stn=hash2((fx*3)|0,(fz*3)|0);
    if(stn<0.03){put(x,r,stn<0.012?'o':':',0,fog);return}         // oil stains
    if(hash2(((fx*1.5)|0)*7,((fz*1.5)|0)*5)<0.05&&hash2((fx*8)|0,(fz*8)|0)<0.5){
      put(x,r,':',1,fog);return}                                  // tarmac patches
    put(x,r,hash2((fx*11)|0,(fz*11)|0)<0.15?'.':' ',0,fog);return}
  if(ter===3){                                                    // riverside promenade
    const ux3=fx-ix,uz3=fz-iz;
    if((TER[iz*G+ix+1]===1&&ux3>0.82)||(TER[iz*G+ix-1]===1&&ux3<0.18)||
       (TER[(iz+1)*G+ix]===1&&uz3>0.82)||(TER[(iz-1)*G+ix]===1&&uz3<0.18)){
      put(x,r,'=',2,fog);return}                                  // railing at the water
    if(hash2((fx*2)|0,(fz*2)|0)<0.03){put(x,r,'*',5,fog);return}  // lamps
    const sg=hash2((fx*6)|0,(fz*6)|0);
    put(x,r,sg<0.45?':':sg<0.8?'.':' ',sg<0.12?28:29,fog);return}
  if(ter===2){                                                    // park: lawn + paths
    if(((fx*0.5+fz*0.5)%3)<0.22){put(x,r,':',3,fog);return}
    const fl=hash2((fx*4)|0,(fz*4)|0);
    if(fl<0.012&&hash2((fx*9)|0,(fz*9)|0)<0.4){                   // sparse flowers, mostly dim
      put(x,r,'*',fl<0.003?20:fl<0.007?21:11,fog);return}
    const tv=hash2((fx*5)|0,(fz*5)|0);
    put(x,r,tv<0.25?'.':tv<0.4?',':' ',27,fog);return}
  const ux2=fx-ix,uz2=fz-iz;                              // contact shadow at building feet
  if(((ux2<0.3&&cellH(ix-1,iz)>2)||(ux2>0.7&&cellH(ix+1,iz)>2)||
      (uz2<0.3&&cellH(ix,iz-1)>2)||(uz2>0.7&&cellH(ix,iz+1)>2))){
    put(x,r,' ',0,fog);return}
  const hh=hash2((fx*9)|0,(fz*9)|0);
  if(hh<0.025){put(x,r,'#',1,fog);return}                         // crates & dumpsters
  if(hh<0.05){put(x,r,'%',27,fog);return}                         // weeds in the cracks
  if(hh<0.075&&hash3((fx*2)|0,(fz*2)|0,3)<0.3){put(x,r,'~',25,fog);return} // puddles
  put(x,r,hh<0.2?',':hh<0.35?'.':' ',0,fog);
}

/* ---------- aerial column renderer with light-trail beams ---------- */
function renderColumn(x,dirX,dirZ,plX,plZ){
  const cxs=2*x/W-1, rdx=dirX+plX*cxs, rdz=dirZ+plZ*cxs;
  let mx=px|0,mz=pz|0;
  const ddx=Math.abs(1/(rdx||1e-9)),ddz=Math.abs(1/(rdz||1e-9));
  const sx=rdx<0?-1:1, sz=rdz<0?-1:1;
  let tx=(rdx<0?(px-mx):(mx+1-px))*ddx, tz=(rdz<0?(pz-mz):(mz+1-pz))*ddz;
  let bot=H-1, dCur=0.02, side=0, gmax=0, wasW=false;
  while(bot>=0&&dCur<MAXD){
    let dNext,nSide;
    if(tx<tz){dNext=tx;nSide=0}else{dNext=tz;nSide=1}
    const mxx=((mx%G)+G)%G, mzz=((mz%G)+G)%G, ci=mzz*G+mxx;  // world wraps: endless city
    const h=HGT[ci];
    if(h===0&&(RI[mxx]===3||RJ[mzz]===3)){        // elevated highway deck
      wasW=false;
      const fog=fogOf(dCur), dH=0.5;
      const rTop=Math.max(0,Math.ceil(HOR+(camH-dH)*pV/dCur));
      if(dCur>0.05){
        const wc=side===0?pz+dCur*rdz:px+dCur*rdx;
        PD=dCur;
        for(let r=Math.min(bot,H-1);r>=rTop;r--){
          const y=camH-(r-HOR)*dCur/pV;
          if(y>dH)continue;
          if(y>0.34)put(x,r,'=',2,fog);          // concrete rim: the deck's thickness
          else if(y>0.2)put(x,r,'-',1,fog);
          else{const al=wc-Math.floor(wc);
            if(al<0.12||al>0.88)put(x,r,'|',1,fog);   // support pillars
            else put(x,r,hash3((wc*4)|0,r,1)<0.3?',':' ',30,fog)}
        }
      }
      bot=Math.min(bot,rTop-1);
      const rFar=Math.max(0,Math.ceil(HOR+(camH-dH)*pV/Math.max(0.01,dNext)));
      const rB4=Math.min(bot,H-1);
      if(rB4>=rFar)FBGB[208+fogOf(dCur)].push(x,rFar,rB4);   // solid deck-top asphalt
      for(let r=rB4;r>=rFar;r--){
        const d=(camH-dH)*pV/(r-HOR);
        PD=d;groundTex(x,r,px+rdx*d,pz+rdz*d,fogOf(d));
      }
      bot=Math.min(bot,rFar-1);gmax=dNext;
    }else if(h===0){
      const bridge=(RI[mxx]&&BRI[mxx])||(RJ[mzz]&&BRJ[mzz]);
      const isW=TER[ci]===1&&!bridge;
      const lvl=isW?camH+0.5:camH;               // water sits 0.5 below the city
      if(!isW&&wasW){                            // embankment wall or arched bridge underside
        const rTopB=Math.max(0,Math.ceil(HOR+camH*pV/dCur));
        const rBW=Math.min(bot,H-1), fgb2=fogOf(dCur);
        PD=dCur;
        if(rBW>=rTopB){
          if(bridge){                            // arches: piers + dark water through the opening
            const wc2=side===0?pz+dCur*rdz:px+dCur*rdx;
            const fr2=wc2-Math.floor(wc2), pierC=fr2<0.16||fr2>0.84;
            for(let r=rBW;r>=rTopB;r--){
              if(r===rTopB)put(x,r,'=',2,fgb2);
              else if(r===rTopB+1)put(x,r,pierC?':':'_',pierC?29:1,fgb2);
              else if(pierC)put(x,r,hash2(x,r)<0.5?':':'|',29,fgb2);
              else put(x,r,hash3(x,r,TB&7)<0.12?'~':' ',25,fgb2);
            }
          }else{                                 // embankment with iron railing bars above
            for(let r=rBW;r>=rTopB;r--){
              if(r===rTopB)put(x,r,'=',2,fgb2);
              else put(x,r,hash2(x*7,r*3)<0.16?'|':hash2(x,r)<0.45?':':'.',29,fgb2);
            }
            if(rTopB-1>=0&&x%3===0){put(x,rTopB-1,'|',3,fgb2);bot=Math.min(bot,rTopB-2)}
          }
          bot=Math.min(bot,rTopB-1);
        }
      }
      const rFar=Math.max(0,Math.ceil(HOR+lvl*pV/Math.max(0.01,dNext)));
      const rB3=Math.min(bot,H-1);
      if(rB3>=rFar){                                     // solid ground backdrops
        const fg3=fogOf(dCur);
        if(TER[ci]===1)FBGB[(isW?200:204)+fg3].push(x,rFar,rB3);
        else{const t3=Math.max(RI[mxx],RJ[mzz]);
          FBGB[(t3?208:TER[ci]===2?216:TER[ci]===3?220:212)+fg3].push(x,rFar,rB3)}
      }
      for(let r=rB3;r>=rFar;r--){
        const d=lvl*pV/(r-HOR);
        PD=d;groundTex(x,r,px+rdx*d,pz+rdz*d,fogOf(d));
      }
      bot=Math.min(bot,rFar-1);gmax=dNext;wasW=isW;
    }else{
      wasW=false;
      const fog=fogOf(dCur), hw2=h*STY;
      const rTop=Math.max(0,Math.ceil(HOR+(camH-hw2)*pV/dCur));
      if(GHOST.has(BID[ci])&&dCur<BOOM+1.6){               // translucent: dithered, no occlusion
        const rB=Math.min(bot,H-1);
        if(dCur>0.05&&rB>=rTop){
          PD=dCur;
          const wc=side===0?pz+dCur*rdz:px+dCur*rdx;
          const mg=Math.floor(wc*8), mlG=mg-Math.floor(wc)*8;
          put(x,rTop,'=',19,fog);                          // roofline stays crisp
          for(let r=rB;r>rTop;r--){
            if(mlG===0||mlG===7){put(x,r,'|',19,fog);continue}   // corner lines
            const dth=hash3(x,r,13);
            if(dth<0.30)put(x,r,dth<0.08?'#':dth<0.18?':':'.',dth<0.08?1:29,fog);
          }
        }
      }else{
      {
        const wc=side===0?pz+dCur*rdz:px+dCur*rdx;
        const bid=BID[ci];
        const rB=Math.min(bot,H-1);
        if(bid===-2&&rB>=rTop)FBGB[196+fog].push(x,rTop,rB);   // foliage backdrop
        if(bid!==-2&&rB>=rTop){          // skylight-graded facade backdrop, even point-blank
          const tone=(hash2(bid<0?ci*7:bid,3)*8)|0, fgb=tone*24+(side?12:0)+fog;
          const dc=Math.max(dCur,0.05);
          const r1=Math.max(rTop,Math.ceil(HOR+(camH-0.65*hw2)*pV/dc));
          const r2=Math.max(r1,Math.ceil(HOR+(camH-0.30*hw2)*pV/dc));
          if(r1>rTop)FBGB[fgb].push(x,rTop,Math.min(r1-1,rB));
          if(r2>r1&&r1<=rB)FBGB[fgb+4].push(x,r1,Math.min(r2-1,rB));
          if(r2<=rB)FBGB[fgb+8].push(x,Math.max(r2,rTop),rB);
        }
        PD=dCur;
        if(dCur>0.05)for(let r=rB;r>=rTop;r--){
          const y=camH-(r-HOR)*dCur/pV;
          if(y<=hw2)wallTex(x,r,bid,side,wc,y/STY,h,fog,mxx,mzz);
        }
        /* light trails rising off the roofline */
        if(rTop<=bot&&rTop>0&&h>=5){
          const cr2=h>=16?(hash2(bid,101)*12)|0:0;
          if(cr2===4){                                    // spire crown (rare)
            const cm=Math.floor(wc*8)-Math.floor(wc)*8;
            if(cm===3){
              const sl=(3+hash2(bid,103)*7)|0;
              for(let k=1;k<=sl;k++){const r2=rTop-k;if(r2<0)break;put(x,r2,'|',3,fog)}
              const on=((NOW/900+hash2(bid,7))%1)<0.5;
              if(rTop-sl-1>=0)put(x,rTop-sl-1,on?'*':'+',on?6:3,fog)}}
        }
      }
      bot=Math.min(bot,rTop-1);
      if(hw2<camH){
        const rFar=Math.max(0,Math.ceil(HOR+(camH-hw2)*pV/Math.max(0.01,dNext)));
        const rB2=Math.min(bot,H-1);
        if(rB2>=rFar)FBGB[192+fog].push(x,rFar,rB2);   // roof slab fill
        for(let r=rB2;r>=rFar;r--){
          const d=(camH-hw2)*pV/(r-HOR);
          PD=d;roofTex(x,r,mxx,mzz,px+rdx*d,pz+rdz*d,h,fogOf(d));
        }
        bot=Math.min(bot,rFar-1);
      }
      }
    }
    if(nSide===0){dCur=tx;tx+=ddx;mx+=sx}else{dCur=tz;tz+=ddz;mz+=sz}
    side=nSide;
  }
  GMAX[x]=gmax;SKYB[x]=Math.min(bot,H-1);
  PD=900;                                                // sky sits behind everything
  /* layered night sky: drifting clouds with lit edges, sparse stars */
  const wcf=(angV/FOV)*W+x, drift=NOW*0.00003;           // near-still cloud drift
  for(let r=Math.min(SKYB[x],H-1);r>=0;r--){
    if(CH[r*W+x]!==' ')continue;
    const n=vn(wcf*0.055+drift,r*0.10)*0.65+vn(wcf*0.14+40,r*0.22+drift*2)*0.35;
    const thr=0.62+(HOR>0?(r/Math.max(1,HOR)):1)*0.14;   // sparser, fainter clouds
    if(n>thr){
      const d2=n-thr;
      if(hash2(x*3,r*7)<0.75)put(x,r,d2>0.12?':':'.',d2>0.05?34:35,2);
    }else if(hash2((wcf)|0,r)<0.013){                    // starfield
      const sb=hash3((wcf)|0,r,5);
      put(x,r,sb<0.12?'*':'.',sb<0.12?5:sb<0.5?35:3,sb<0.3?1:2)}
  }
}

/* ---------- traffic & planes ---------- */
const cars=[];
function spawnLine(ax,i,t){
  const n=t===3?6:t===2?3:1;
  for(let k=0;k<n;k++){const dir=t===1?(hash2(i,9)<0.5?1:-1):(k%2?1:-1);
    cars.push({ax,i0:i,t:rnd()*G,dir,ty:t,
      sp:t===3?1.6+rnd()*0.6:t===2?0.8+rnd()*0.4:0.5+rnd()*0.25})}
  if(t===2)for(let k=0;k<2;k++)                       // buses on avenues
    cars.push({ax,i0:i,t:rnd()*G,dir:k?1:-1,ty:t,bus:1,sp:0.55+rnd()*0.2});
}
for(let i=4;i<G-4;i++){
  if(RI[i]&&RIO[i]===0)spawnLine(0,i,RI[i]);
  if(RJ[i]&&RJO[i]===0)spawnLine(1,i,RJ[i]);
}
function laneOff(c){return c.ty===1?0.5:c.ty===2?(c.dir>0?c.ty*0.27:c.ty*0.73)
  :(c.dir>0?c.ty*0.3:c.ty*0.7)}
const planes=[];
for(let k=0;k<3;k++)planes.push({x:rnd()*G,z:rnd()*G,a:rnd()*6.28,alt:10+rnd()*8,sp:3+rnd()*2});
for(let k=0;k<2;k++)planes.push({x:rnd()*G,z:rnd()*G,a:rnd()*6.28,alt:7+rnd()*3,sp:1.2+rnd(),heli:1});
const BOOMS=[];let lastBoomT=0;                         // laser impact fireballs
function capClear(x,z,a2,len,alt){                      // hull corridor free of towers?
  const cx2=Math.cos(a2),cz2=Math.sin(a2);
  const st=Math.max(0.04,0.7/len);
  for(let u=-0.5;u<=0.51;u+=st){
    const i=((Math.floor(x+cx2*len*u)%G)+G)%G, j=((Math.floor(z+cz2*len*u)%G)+G)%G;
    if(HGT[j*G+i]*STY>alt-0.25)return false}
  return true}
const CAPS=[];                                          // dragons, on the flight level
function capFar(x,z,self){                              // keep dragons apart
  for(const o of CAPS){if(o===self)continue;
    let dx=x-o.x,dz=z-o.z;dx-=G*Math.round(dx/G);dz-=G*Math.round(dz/G);
    if(dx*dx+dz*dz<144)return false}
  return true}
function capSpawn(g,avX,avZ){                           // place it in front of the player
  const aMin=(g.alt0||g.alt)-0.75;                        // clearance at the breathing low point
  const farFrom=(x,z)=>{if(avX===undefined)return true;   // and away from where it just died
    let dx=x-avX,dz=z-avZ;dx-=G*Math.round(dx/G);dz-=G*Math.round(dz/G);
    return dx*dx+dz*dz>625};
  for(let t=0;t<60;t++){
    const aV=ang+(rnd()-0.5)*1.0, d=20+rnd()*14;
    const x=((px+Math.cos(aV)*d)%G+G)%G, z=((pz+Math.sin(aV)*d)%G+G)%G;
    const na=rnd()*6.28;
    if(farFrom(x,z)&&capFar(x,z,g)&&capClear(x,z,na,g.len,aMin)){g.x=x;g.z=z;g.a=na;return}}
  for(let t=0;t<60;t++){const x=rnd()*G,z=rnd()*G;
    if(farFrom(x,z)&&capFar(x,z,g)&&capClear(x,z,g.a,g.len,aMin)){g.x=x;g.z=z;return}}}
for(let k=0;k<3;k++){
  const cAlt=7.0+k*0.3, cLen=7+k*2.5;
  const g={x:0,z:0,a:rnd()*6.28,sp:0.4+rnd()*0.5,len:cLen,alt:cAlt,alt0:cAlt,alt00:cAlt,ph:rnd()*97,hp:60};
  capSpawn(g);CAPS.push(g);

        else if(chh==='#')kd=rel<=-4?23:rel<0?22:6;                // shadow side -> lit side
        else if(chh==='=')kd=rel<0?23:22;
        else if(chh==='o'){if(boost){ch2='#';kd=12}else{kd=20}}    // engine bells
        else if(chh==='<'){const on=((NOW/650)|0)%2;ch2=on?'*':'<';kd=on?6:23}
        else if(chh==='>'){const on=((NOW/650)|0)%2;ch2=on?'>':'*';kd=on?23:8}
        if(ixh===lastIx&&iy>=4&&kd===23)kd=20;                     // amber rim light
        put(cxa,rr,ch2,kd,fgS);                                    // the hull stays matte — only fire blooms
      }
    }
    const flLen=boost?10:4+Math.min(3,(spd/2)|0);         // hearty idle burn, roaring boost
    const shJet=Math.round(bankS*((CRAFT.length-2)-(CRAFT.length>>1))*-1.2);
    for(const jo of [-3,3])for(let k2=1;k2<=flLen;k2++){
      const rr2=rowC+2+k2+bob;
      const jx=colC+jo+shJet;
      const wSp=boost?Math.max(0,2-(k2>>2)):Math.max(0,1-(k2>>2));
      for(let dxj=-wSp;dxj<=wSp;dxj++){
        const f3=hash3(jx+dxj,k2*3+((NOW/60)|0),7);
        if(f3<(boost?0.92:0.88)){
          const ch3=k2<3?'#':k2<6?'w':f3<0.5?'v':'~';
          const kd3=boost&&k2<2?(f3<0.5?5:12):k2<(boost?4:2)?20:22;
          put(jx+dxj,rr2,ch3,kd3,0);GLOWQ.push(jx+dxj,rr2,kd3*4)}  // engines burn into the halo
      }
    }
    if(keys['f']){                                        // nose laser: neon violet
      const hx2=Math.cos(ang),hz2=Math.sin(ang);          // fired along the ship's heading
      let hitT=40,capHit=null;
      for(let t2=1.2;t2<40;t2+=0.35){
        const bxs=shipX+hx2*t2,bzs=shipZ+hz2*t2;
        for(const g of CAPS){                             // dragons are fair game
          if(Math.abs(g.alt-shipH)>3)continue;
          let rxc=bxs-g.x,rzc=bzs-g.z;
          rxc-=G*Math.round(rxc/G);rzc-=G*Math.round(rzc/G);
          const axc=Math.cos(g.a),azc=Math.sin(g.a);
          let al=rxc*axc+rzc*azc;al=Math.max(-g.len/2,Math.min(g.len/2,al));
          const ddx=rxc-axc*al,ddz=rzc-azc*al;
          if(ddx*ddx+ddz*ddz<0.85){capHit=g;hitT=t2;break}
        }
        if(capHit)break;
        if(solidTop(bxs,bzs)>shipH-0.06){hitT=t2;break}
      }
      if(hitT<40&&NOW-lastBoomT>45){                      // seed fireballs continuously
        lastBoomT=NOW;
        BOOMS.push({x:shipX+hx2*hitT,z:shipZ+hz2*hitT,h:capHit?capHit.alt:shipH,t0:NOW,sN:0.55});
        if(BOOMS.length>40)BOOMS.shift();
        // only re-arm the flash once the last window played out — resetting
        // every hit pinned hs≈0 and read as constant red under a held beam
        if(capHit&&!(NOW-(capHit.hitT||0)<650))capHit.hitT=NOW;
        if(capHit&&--capHit.hp<=0){                       // the kill: fire down the length
          for(let q=0;q<10;q++)
            BOOMS.push({x:capHit.x+Math.cos(capHit.a)*capHit.len*(q/9-0.5),
                        z:capHit.z+Math.sin(capHit.a)*capHit.len*(q/9-0.5),
                        h:capHit.alt,t0:NOW+q*60,sN:1.6});
          for(let q=0;q<5;q++)
            BOOMS.push({x:capHit.x,z:capHit.z,h:capHit.alt+(q-2)*0.3,t0:NOW+320+q*90,sN:2.4});
          BOOMS.push({x:capHit.x,z:capHit.z,h:capHit.alt,t0:NOW+680,sN:3.2});
          capSpawn(capHit,capHit.x,capHit.z);capHit.hp=60;
        }
      }
      const bx=shipX+hx2*hitT,bz=shipZ+hz2*hitT;
      let rxE=bx-px,rzE=bz-pz;
      rxE-=G*Math.round(rxE/G);rzE-=G*Math.round(rzE/G);
      const tyE=invDet*(-plZ*rxE+plX*rzE);
      if(tyE>0.4){
        const t1E=invDet*(dirZ*rxE-dirX*rzE);
        const ccE=Math.round((W/2)*(1+t1E/tyE));
        const aimH=capHit?capHit.alt:shipH;               // the beam climbs to its target
        const rrE=Math.round(HOR+(camH-aimH)*pV/tyE);
        // fired from the nose/mouth at the front of the craft, not from under
        // the belly; a small hull buffer keeps the fat beam off the ship
        const mouthRow=0;
        const noseR=rowC-CRAFT.length+1+bob;
        const noseC=colC+Math.round(bankS*(mouthRow-(CRAFT.length>>1))*-1.2);
        const steps=Math.max(Math.abs(ccE-noseC),Math.abs(rrE-noseR),1);
        const blockedByHull=(bc,br)=>{
          for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)
            if(shipMask.has((br+dr)*W+bc+dc))return true;
          return false;
        };
        const beamPut=(bc,br,ch,kd)=>{
          if(blockedByHull(bc,br))return;
          put(bc,br,ch,kd,0);GLOWQ.push(bc,br,kd*4);
        };
        for(let k3=0;k3<=steps;k3++){
          const u=k3/steps;
          const cc=Math.round(noseC+(ccE-noseC)*u), rr=Math.round(noseR+(rrE-noseR)*u);
          PD=1/((1-u)/BOOM+u/tyE);                        // perspective-correct depth
          const fz3=hash3(k3,(NOW/50)|0,3);
          beamPut(cc,rr,fz3<0.7?'#':'=',fz3<0.85?36:5);
          beamPut(cc-1,rr,'=',37);beamPut(cc+1,rr,'=',37);    // fat glowing beam
        }
      }
    }
  }
  PB=0;
  for(const b of BRIDGES){                    // suspension bridge: towers, cables, suspenders
    const len=b.e-b.s, steps=Math.max(24,(len*10)|0);
    const susEv=Math.max(3,Math.round(steps/len));
    for(let sdi=0;sdi<2;sdi++){                // a cable plane down EACH edge of the deck
    const off2=(sdi?1:-1)*(b.w||2)*0.35;
    let pc=-9999,pr=0;
    for(let k=0;k<=steps;k++){
      const t=k/steps, w0=b.s+len*t;
      const wx=b.ax?w0:b.c+off2, wz=b.ax?b.c+off2:w0;
      let rx=wx-px,rz=wz-pz;
      rx-=G*Math.round(rx/G);rz-=G*Math.round(rz/G);
      const ty=invDet*(-plZ*rx+plX*rz);if(ty<1.2||ty>45){pc=-9999;continue}
      const t1=invDet*(dirZ*rx-dirX*rz);
      const sxc=Math.round((W/2)*(1+t1/ty));
      if(sxc<-80||sxc>W+80){pc=-9999;continue}
      PD=ty;
      const fg=fogOf(ty), tw=0.12, top=0.62;
      let cy,ch;
      if(t<tw){cy=0.03+(top-0.03)*(t/tw);ch='/'}          // anchor up to tower
      else if(t>1-tw){cy=0.03+(top-0.03)*((1-t)/tw);ch='\\'}
      else{const q=(t-0.5)/(0.5-tw);cy=0.10+(top-0.10)*q*q;   // dip between towers
        ch=Math.abs(q)>0.7?(t<0.5?'\\':'/'):'-'}
      const rC=Math.round(HOR+(camH-cy)*pV/ty);
      if(pc>-9000){                            // rasterize a connected segment
        const d0=Math.min(pc,sxc),d1=Math.max(pc,sxc);
        for(let cc=Math.max(0,d0);cc<=Math.min(W-1,d1);cc++){
          const f2=d1===d0?0:(cc-d0)/(d1-d0);
          const rr=Math.round(sxc>=pc?pr+(rC-pr)*f2:rC+(pr-rC)*f2);
          put(cc,Math.max(0,rr),ch,2,fg);
        }
      }else if(sxc>=0&&sxc<W)put(sxc,Math.max(0,rC),ch,2,fg);
      pc=sxc;pr=rC;
      if(sxc>=0&&sxc<W-1){
        if(k%susEv===0&&t>tw&&t<1-tw){         // suspender cables down to the deck
          const rD=Math.min(H-1,Math.round(HOR+(camH-0.03)*pV/ty));
          for(let r=rC+1;r<rD;r++)put(sxc,r,'|',3,fg)}
        if(Math.abs(t-tw)<=0.5/steps||Math.abs(t-(1-tw))<=0.5/steps){  // towers at each end
          const rT2=Math.round(HOR+(camH-0.8)*pV/ty), rD2=Math.min(H-1,Math.round(HOR+camH*pV/ty));
          for(let r=Math.max(0,rT2);r<=rD2;r++){
            const tc=(r-rT2)%3===0?'#':'|';
            put(sxc,r,tc,2,fg);put(sxc+1,r,tc,2,fg)}
        }
      }
    }
    }
  }
  ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle=skyGrad;
  for(let x=0;x<W;x++)if(SKYB[x]>=0)ctx.fillRect(x*CW,0,CW,(SKYB[x]+1)*LH);
  for(let i=0;i<FBGB.length;i++){const b=FBGB[i];if(!b.length)continue;
    ctx.fillStyle=FBGC[i];
    for(let k=0;k<b.length;k+=3)ctx.fillRect(b[k]*CW,b[k+1]*LH,CW,(b[k+2]-b[k+1]+1)*LH)}
  ctx.font=FONT;ctx.textBaseline='top';
  for(let r=0;r<H;r++){
    let run='',rc=-1,rb=0,rx0=0;const y=r*LH,off=r*W;
    for(let x=0;x<W;x++){
      const ch=CH[off+x];
      if(ch===' '){if(run)run+=' ';continue}
      const co=CO[off+x],bt=BRT[off+x];
      if(co!==rc||bt!==rb||!run){
        if(run&&(rb||(rc&3)<3)){ctx.fillStyle=(rb?FPAL:FPALD)[rc>>2][rc&3];
          if(!rb){const fr=(0.5-r/H)/0.5;                 // the upper half of the frame
            if(fr>0)ctx.globalAlpha=Math.max(0.1,1-fr*1.25)}   // falls almost black
          ctx.fillText(run,rx0*CW,y);ctx.globalAlpha=1}
        run=ch;rc=co;rb=bt;rx0=x}
      else run+=ch;
    }
    if(run&&(rb||(rc&3)<3)){ctx.fillStyle=(rb?FPAL:FPALD)[rc>>2][rc&3];
          if(!rb){const fr=(0.5-r/H)/0.5;                 // the upper half of the frame
            if(fr>0)ctx.globalAlpha=Math.max(0.1,1-fr*1.25)}   // falls almost black
          ctx.fillText(run,rx0*CW,y);ctx.globalAlpha=1}
  }
  if(BLOOM_OK&&GLOWQ.length){                  // flame + laser + blast bloom: quarter-res halo,
    gctx.clearRect(0,0,gcv.width,gcv.height);  // blurred once on the way back up
    const qw=CW/4,qh=LH/4;
    for(let i=0;i<GLOWQ.length;i+=3){
      const x=GLOWQ[i],r=GLOWQ[i+1],co=GLOWQ[i+2];
      if(x<0||x>=W||r<0||r>=H)continue;
      gctx.fillStyle=FPAL[co>>2][co&3];
      gctx.globalAlpha=0.14;gctx.fillRect((x-2)*qw,(r-1.2)*qh,qw*5,qh*3.4);
      gctx.globalAlpha=0.45;gctx.fillRect((x-0.7)*qw,(r-0.35)*qh,qw*2.4,qh*1.7);
    }
    gctx.globalAlpha=1;
    ctx.globalCompositeOperation='screen';
    ctx.filter='blur(6px)';
    ctx.drawImage(gcv,0,0,cv.width,cv.height);
    ctx.filter='none';ctx.globalCompositeOperation='source-over';
  }
  ctx.globalCompositeOperation='screen';                 // sky glow blended over the scene
  ctx.globalAlpha=0.065;
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(showMap){                                  // circular radar, heading-up, always on
    const mR=Math.min(96,cv.width*0.085), mcx=cv.width-mR-18, mcy=mR+52;
    ctx.save();
    ctx.beginPath();ctx.arc(mcx,mcy,mR,0,7);ctx.clip();
    ctx.fillStyle='rgba(5,11,9,0.85)';ctx.fillRect(mcx-mR,mcy-mR,2*mR,2*mR);
    const rng=20, sc=mR/rng;
    const ca=Math.cos(-ang-Math.PI/2), sa=Math.sin(-ang-Math.PI/2);
    const fx0=px-(px|0), fz0=pz-(pz|0);
    for(let dj=-rng;dj<=rng;dj++)for(let di=-rng;di<=rng;di++){
      if(di*di+dj*dj>rng*rng)continue;
      const wi=((((px|0)+di)%G)+G)%G, wj=((((pz|0)+dj)%G)+G)%G;
      const h=HGT[wj*G+wi],tr=TER[wj*G+wi],bd=BID[wj*G+wi];
      let col=null;
      if(tr===1)col='#1c3450';
      else if(tr===2)col='#285030';
      else if(bd===-3||bd===-4)col='#3fae7a';
      else if(h)col=h>24?'#c8d4c8':h>10?'#6f7d74':'#37423a';
      else if(RI[wi]||RJ[wj])col='#151d1a';
      if(!col)continue;
      const rx2=di+0.5-fx0, rz2=dj+0.5-fz0;     // sub-cell offset: buttery scrolling
      ctx.fillStyle=col;
      ctx.fillRect(mcx+(rx2*ca-rz2*sa)*sc-sc*0.5,mcy+(rx2*sa+rz2*ca)*sc-sc*0.5,sc+0.6,sc+0.6);
    }
    ctx.fillStyle='#ffec9e';                    // you, facing up
    ctx.strokeStyle='rgba(10,20,14,0.9)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(mcx,mcy-11);ctx.lineTo(mcx-7,mcy+8);ctx.lineTo(mcx+7,mcy+8);
    ctx.closePath();ctx.stroke();ctx.fill();
    ctx.restore();
    ctx.strokeStyle='rgba(140,230,180,0.5)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(mcx,mcy,mR,0,7);ctx.stroke()}
  px=shipX;pz=shipZ;camH=shipH;                           // hand physics its coords back
  rafId=requestAnimationFrame(frame);
}
rafId=requestAnimationFrame(frame);
</script>
